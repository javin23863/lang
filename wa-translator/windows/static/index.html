<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/app-runtime.js"></script>
<script src="/qr.js" defer></script>
<title>Lingua Relay · Private rooms</title>
<style>
*{box-sizing:border-box}:root{color-scheme:light dark;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--bg:#F2F2F7;--card:#FFFFFF;--fill:#F2F2F7;--separator:#C6C6C8;--label:#000;--label-2:#8E8E93;--accent:#007AFF;--destructive:#FF3B30;--confirm:#34C759;--focus:#007AFF}
@media (prefers-color-scheme: dark){:root{--bg:#000;--card:#1C1C1E;--fill:#2C2C2E;--separator:#38383A;--label:#FFF;--label-2:#8E8E93;--focus:#0A84FF}}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;-webkit-font-smoothing:antialiased;padding:clamp(16px,4vw,42px) clamp(12px,4vw,42px) calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.page{width:min(560px,100%);display:grid;gap:16px;align-content:start}
.title{font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.1;margin:8px 0 0}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.state{margin:0;padding:14px 16px;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--label)}
.state[data-state="open"]{color:var(--confirm)}.state[data-state="closed"],.state[data-state="expired"],.state[data-state="error"]{color:var(--destructive)}
.room{display:grid;gap:14px;padding:16px}.room[hidden]{display:none}
.field{display:grid;gap:7px;color:var(--label-2);font-size:13px}
input{width:100%;min-width:0;min-height:44px;border:none;border-radius:10px;background:var(--fill);color:var(--label);font:15px ui-monospace,SFMono-Regular,Consolas,monospace;padding:12px;direction:ltr;text-align:left}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.actions button{overflow-wrap:anywhere;line-height:1.2;font-size:15px}
button{border:none;border-radius:12px;min-height:44px;padding:10px 12px;font:600 17px var(--font);letter-spacing:-.01em;cursor:pointer;background:var(--fill);color:var(--accent)}
button.primary{background:var(--accent);color:#FFF;min-height:50px}
button.danger{background:transparent;color:var(--destructive)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{cursor:wait;opacity:.4}
.share{grid-template-columns:repeat(3,minmax(0,1fr))}
/* A camera reads dark modules on a light field: the code carries its own paper
   rather than inheriting a dark-appearance card. */
#qrBox{display:grid;place-items:center;margin:0;padding:12px;border-radius:12px;background:#FFF;color:#000}
#qrBox[hidden]{display:none}
#qrBox svg{display:block;width:min(228px,58vw);height:auto}
.notice{min-height:20px;margin:-6px 4px 0;color:var(--label-2);font-size:13px}
.roomLabel{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--label-2)}
/* Until /api/me answers, neither the sign-in card nor the account surfaces are
   shown: a signed-in host must never see a sign-in button flash by. */
body:not([data-auth="in"]) .authed{display:none}
body:not([data-auth="out"]) #authPanel{display:none}
body[data-auth="out"] #authPanel{display:grid}
#authPanel{gap:12px;padding:16px}
.prompt{margin:0;color:var(--label-2);font-size:15px;line-height:1.4}
.signIn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;background:var(--accent);color:#FFF;font:600 17px var(--font);text-decoration:none;padding:10px 12px;text-align:center}
.signIn~.signIn{background:var(--fill);color:var(--accent)}
#authStatus{margin:0;color:var(--destructive);font-size:13px;min-height:0}
/* An id carrying `display` outranks the `.authed` rule above and the card can
   never be hidden, so the account surfaces state their layout only for the
   state that shows them — same shape as #authPanel's hide rule. */
body[data-auth="in"] #accountChip{display:flex}
#accountChip{align-items:center;gap:12px;padding:8px 16px}
#accountName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#signOutBtn{background:transparent;min-height:44px}
.modes{display:grid;gap:12px}
.tile{display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;border-radius:16px;background:var(--card);color:var(--accent);font-size:17px}
.calleeField{padding:14px 16px;gap:7px}
.hint{color:var(--label-2);font-size:13px}
.credits{display:grid;gap:12px;padding:16px}
#creditsBalance{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
#buyCreditsBtn{width:100%}
#usageList{list-style:none;margin:0;padding:0;display:grid}
#usageList li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;min-height:34px;padding:7px 0;border-top:.5px solid var(--separator);font-size:15px}
#usageList li:first-child{border-top:none}
#usageList .when{color:var(--label-2);font-size:13px}
#deleteAccountBtn{width:calc(100% + 32px);text-align:center;font-weight:400;border-top:.5px solid var(--separator);border-radius:0;margin:2px -16px -16px}
.appLocale{display:grid;gap:7px;padding:14px 16px;color:var(--label-2);font-size:13px}
.appLocale select{width:100%;min-width:0;min-height:44px;border:none;border-radius:10px;background:var(--fill);color:var(--label);font:17px var(--font);padding:11px 10px}
.legal{display:grid}
.legal a{display:flex;align-items:center;min-height:44px;padding:0 16px;color:var(--accent);font-size:17px;text-decoration:none;border-top:.5px solid var(--separator)}
.legal a:first-child{border-top:none}
@media(max-width:500px){.actions{grid-template-columns:1fr 1fr}}
@media(max-width:380px){body{padding:12px 8px}.actions{gap:7px}.actions button{font-size:14px;padding:9px 7px}input{font-size:13px}}
</style>
</head>
<body data-auth="loading">
<main class="page" aria-label="Lingua Relay">
  <h1 class="title">Lingua Relay</h1>
  <section id="authPanel" class="card" aria-label="Sign in">
    <p class="prompt" data-i18n="auth.signInPrompt">Sign in to start a call. Joining an invite link never needs an account.</p>
    <div id="authButtons"></div>
    <p id="authStatus" role="status" aria-live="polite"></p>
  </section>
  <section id="accountChip" class="card authed" aria-label="Account">
    <span id="accountName"></span>
    <button id="signOutBtn" type="button" data-i18n="auth.signOut">Sign out</button>
  </section>
  <section class="card authed">
    <p id="roomState" class="state" data-state="idle" aria-live="polite">No active room on this device.</p>
  </section>
  <section id="roomPanel" class="card room authed" hidden aria-label="Current private room">
    <p class="roomLabel" data-i18n="home.roomControl">Room control</p>
    <label class="field" for="shareLink"><span data-i18n="home.participantLink">Participant link</span>
      <input id="shareLink" type="url" readonly spellcheck="false" autocomplete="off">
    </label>
    <div class="actions">
      <button id="copyBtn" type="button" data-i18n="home.copyLink">Copy link</button>
      <button id="shareBtn" type="button" data-i18n="home.share">Share</button>
      <button id="openBtn" type="button" data-i18n="home.openRoom">Open room</button>
      <button id="closeBtn" class="danger" type="button" data-i18n="home.closeRoom">Close room</button>
    </div>
    <div class="actions share">
      <button id="waBtn" type="button">WhatsApp</button>
      <button id="lineBtn" type="button">LINE</button>
      <button id="qrBtn" type="button" aria-expanded="false" aria-controls="qrBox" data-i18n="share.qr">QR code</button>
    </div>
    <figure id="qrBox" hidden></figure>
  </section>
  <p id="roomNotice" class="notice" role="status" aria-live="polite"></p>
  <section class="modes authed" aria-label="Start a call">
    <label class="card field calleeField" for="calleeName"><span data-i18n="tile.calleeName">Who are you calling?</span>
      <input id="calleeName" type="text" maxlength="40" autocomplete="off" spellcheck="false">
      <span class="hint" data-i18n="tile.calleeHint">Optional — shown on the call screen.</span>
    </label>
    <button id="createVoiceBtn" class="tile" type="button" data-i18n="tile.voice">Voice call</button>
    <button id="createChatBtn" class="tile" type="button" data-i18n="tile.chat">Text chat</button>
    <button id="createBtn" class="tile" type="button" data-i18n="tile.video">Video call</button>
  </section>
  <section id="creditsPanel" class="card credits authed" aria-labelledby="creditsHeading">
    <p id="creditsHeading" class="roomLabel" data-i18n="credits.heading">Credits</p>
    <p id="creditsBalance"></p>
    <button id="buyCreditsBtn" type="button" data-stub disabled data-i18n="credits.buy">Buy credits</button>
    <p class="hint" data-i18n="credits.buyUnavailable">Buying credits is not available yet.</p>
    <p class="roomLabel" data-i18n="credits.usageHeading">Recent usage</p>
    <ul id="usageList"></ul>
    <button id="deleteAccountBtn" class="danger" type="button" data-i18n="auth.deleteAccount">Delete account</button>
  </section>
  <label class="card appLocale" for="appLocaleSel"><span data-i18n="gate.language">Language</span>
    <select id="appLocaleSel"></select>
  </label>
  <nav class="legal card" aria-label="Legal and support">
    <a href="privacy.html" data-i18n="legal.privacy">Privacy</a><a href="terms.html" data-i18n="legal.terms">Terms</a><a href="support.html" data-i18n="legal.support">Support</a>
  </nav>
</main>
<script>
const STORAGE_KEY = "live-translator.host-room.v1";
const $ = id => document.getElementById(id);
const runtime = window.LinguaRuntime;
const t = runtime.t;
let currentRoom = null;
let account = null;
let statusTimer = null;
let busy = false;
// Every visible line is stored as its key, never as finished text, so a
// language switch can re-render the screen the person is already looking at.
let stateKey = "home.noRoom", stateParams = null, noticeKey = "", noticeParams = null;
let authStatusKey = "";

// The three surfaces a room can open as. Video is the mode that needs no
// parameter, so every link made before modes existed still opens a video call.
const MODES = new Set(["voice", "chat", "video"]);
// Google is provisioned day one and leads the list; the others appear only
// when the worker reports credentials for them.
const PROVIDERS = [["google", "signInGoogle"], ["apple", "signInApple"],
                   ["facebook", "signInFacebook"]];
const USAGE_KIND = {call: "credits.callMinutes", chat: "credits.chatMessages",
                    tts: "credits.ttsPhrases"};

function roomMode(room) {
  return MODES.has(room?.mode) ? room.mode : "video";
}

function roomUrl(room) {
  const url = new URL(runtime.inviteUrl(room));
  const mode = roomMode(room);
  if (mode !== "video") url.searchParams.set("m", mode);
  // The callee's name is a label on the call screen and nothing else: it is
  // never sent to the server and never part of the signed token.
  if (mode === "voice" && room?.callee) url.searchParams.set("n", room.callee);
  return url.toString();
}

// `mode` and `callee` are optional on purpose: a record saved before modes
// existed is still a valid room and still opens.
function validRoom(value) {
  return value && typeof value.path === "string" && typeof value.host_control === "string"
    && Number.isSafeInteger(value.expires_at);
}

async function loadRoom() {
  try {
    const value = JSON.parse(await runtime.loadHostRoom() || "null");
    return validRoom(value) ? value : null;
  } catch (_) {
    return null;
  }
}

async function saveRoom(room) {
  try {
    return runtime.saveHostRoom(JSON.stringify(room));
  } catch (_) {
    return false;
  }
}

async function forgetRoom() {
  await runtime.forgetHostRoom();
}

function setNotice(key, params) {
  noticeKey = key || "";
  noticeParams = params || null;
  $("roomNotice").textContent = noticeKey ? t(noticeKey, noticeParams) : "";
}

function setState(state, key, params) {
  stateKey = key;
  stateParams = params || null;
  $("roomState").dataset.state = state;
  $("roomState").textContent = t(key, params);
}

function renderRoom(state, participantCount) {
  $("roomPanel").hidden = !currentRoom;
  if (!currentRoom) return;
  $("shareLink").value = roomUrl(currentRoom);
  const count = Number.isInteger(participantCount) ? participantCount : 0;
  if (state !== "open") setState(state, "home.roomReady");
  else if (count === 1) setState(state, "home.roomOpenOne");
  else setState(state, "home.roomOpenMany", {count});
}

function setBusy(value) {
  busy = value;
  for (const id of ["createVoiceBtn", "createChatBtn", "createBtn",
                    "copyBtn", "shareBtn", "openBtn", "closeBtn",
                    "waBtn", "lineBtn", "qrBtn"]) {
    $(id).disabled = value;
  }
}

// ── Account, sign-in and credits ─────────────────────────
async function loadAccount() {
  try {
    // Same-origin, so the session cookie rides along without a credentials
    // option. A native shell talks to another origin and reads signed-out.
    const response = await fetch(runtime.apiUrl("/api/me"), {headers: {Accept: "application/json"}});
    if (!response.ok) throw new Error("account unavailable");
    return await response.json();
  } catch (_) {
    // An unreachable worker is a signed-out screen with no provider to offer,
    // never a blank page.
    return {signed_in: false, providers: []};
  }
}

function setAuthStatus(key) {
  authStatusKey = key || "";
  $("authStatus").textContent = authStatusKey ? t(authStatusKey) : "";
}

function renderProviders() {
  const offered = Array.isArray(account?.providers) ? account.providers : [];
  const box = $("authButtons");
  box.replaceChildren();
  for (const [provider, id] of PROVIDERS) {
    if (!offered.includes(provider)) continue;
    const link = document.createElement("a");
    link.id = id;
    link.className = "signIn";
    link.href = runtime.apiUrl("/auth/" + provider + "/start");
    // The runtime repaints anything carrying a key, so these labels follow a
    // language change for free.
    link.dataset.i18n = "auth." + id;
    link.textContent = t(link.dataset.i18n);
    box.appendChild(link);
  }
}

function renderAccount() {
  if (!account) return;   // /api/me has not answered yet: show neither side
  document.body.dataset.auth = account.signed_in ? "in" : "out";
  renderProviders();
  if (!account?.signed_in) return;
  $("accountName").textContent = t("auth.signedInAs", {name: account.user?.name || ""});
  $("creditsBalance").textContent =
    t("credits.balance", {count: Number(account.credits?.balance) || 0});
  const rows = Array.isArray(account.recent) ? account.recent.slice(0, 20) : [];
  const list = $("usageList");
  list.replaceChildren();
  if (!rows.length) {
    const empty = document.createElement("li");
    empty.textContent = t("credits.usageEmpty");
    list.appendChild(empty);
    return;
  }
  for (const row of rows) {
    const item = document.createElement("li");
    const when = document.createElement("span");
    when.className = "when";
    const at = new Date(row.at);
    when.textContent = Number.isNaN(at.getTime()) ? "" : at.toLocaleDateString(runtime.i18n.locale);
    const what = document.createElement("span");
    // The unit count sits inside the sentence, so a language that puts the
    // number last still reads correctly.
    what.textContent = USAGE_KIND[row.kind]
      ? t(USAGE_KIND[row.kind], {count: Number(row.units) || 0}) : String(row.units);
    item.append(when, what);
    list.appendChild(item);
  }
}

async function deleteAccount() {
  if (!window.confirm(t("auth.deleteConfirm"))) return;
  try {
    const response = await fetch(runtime.apiUrl("/api/account/delete"),
                                 {method: "POST", headers: {Accept: "application/json"}});
    if (!response.ok) throw new Error("delete failed");
    location.reload();
  } catch (_) {
    setNotice("auth.deleteFailed");
  }
}

function stopPolling() {
  clearInterval(statusTimer);
  statusTimer = null;
}

// The invite link is a bearer token: its code lives only as long as the room it
// opens, so a room that changed or ended leaves no scannable copy behind.
function hideQr() {
  $("qrBox").replaceChildren();
  $("qrBox").hidden = true;
  $("qrBtn").setAttribute("aria-expanded", "false");
}

async function clearCurrentRoom(state, key) {
  await forgetRoom();
  currentRoom = null;
  stopPolling();
  hideQr();
  $("roomPanel").hidden = true;
  setState(state, key);
}

function startPolling() {
  stopPolling();
  if (!currentRoom) return;
  statusTimer = setInterval(() => {
    if (document.visibilityState === "visible") refreshStatus();
  }, 15000);
}

async function refreshStatus() {
  if (!currentRoom || busy) return;
  try {
    const response = await fetch(runtime.apiUrl("/api/room-control"), {
      headers: {Authorization: "Bearer " + currentRoom.host_control, Accept: "application/json"}
    });
    if (response.status === 403) {
      await clearCurrentRoom("expired", "home.controlLost");
      return;
    }
    if (!response.ok) throw new Error("status unavailable");
    const value = await response.json();
    if (value.state === "closed") {
      await clearCurrentRoom("closed", "home.roomClosed");
      return;
    }
    if (value.state !== "ready" && value.state !== "open") throw new Error("invalid room state");
    renderRoom(value.state, value.participant_count);
    setNotice("");
  } catch (_) {
    setState("error", "home.statusUnavailable");
  }
}

async function createRoom(mode) {
  if (busy) return;
  if (currentRoom) {
    if (!window.confirm(t("home.confirmReplace"))) return;
    await closeRoom(false);
    if (currentRoom) return;
  }
  setBusy(true);
  setNotice("");
  try {
    const response = await fetch(runtime.apiUrl("/api/rooms"), {
      method: "POST", headers: {Accept: "application/json"}
    });
    if (!response.ok) throw new Error("creation failed");
    const room = await response.json();
    if (!validRoom(room)) throw new Error("storage unavailable");
    // The mode and the callee's label belong to this device's record, not to
    // the room the server signed.
    room.mode = MODES.has(mode) ? mode : "video";
    const callee = $("calleeName").value.trim();
    if (room.mode === "voice" && callee) room.callee = callee;
    if (!await saveRoom(room)) throw new Error("storage unavailable");
    currentRoom = room;
    hideQr();
    renderRoom("ready", 0);
    startPolling();
    setNotice("home.linkReady");
  } catch (_) {
    setState("error", "home.createFailed");
  } finally {
    setBusy(false);
  }
}

async function copyLink() {
  if (!currentRoom || busy) return;
  const link = roomUrl(currentRoom);
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(link);
    else {
      $("shareLink").focus();
      $("shareLink").select();
      if (!document.execCommand("copy")) throw new Error("copy failed");
    }
    setNotice("home.linkCopied");
  } catch (_) {
    $("shareLink").focus();
    $("shareLink").select();
    setNotice("home.selectToCopy");
  }
}

const SHARE_TEXT = {voice: "share.textVoice", chat: "share.textChat", video: "share.textVideo"};

function shareMessage() {
  return t(SHARE_TEXT[roomMode(currentRoom)]) + " " + roomUrl(currentRoom);
}

function openShareApp(url) {
  const opened = window.open(url, "_blank", "noopener");
  if (opened) opened.opener = null;
  else setNotice("home.openBlocked");
}

async function shareLink() {
  if (!currentRoom || busy) return;
  const link = roomUrl(currentRoom);
  if (await runtime.share({
    title: t("share.title"),
    text: t(SHARE_TEXT[roomMode(currentRoom)]),
    url: link
  })) {
    setNotice("home.linkShared");
    return;
  }
  await copyLink();
}

function openRoom() {
  if (!currentRoom || busy) return;
  if (!runtime.openRoom(currentRoom, roomMode(currentRoom))) {
    setNotice("home.openBlocked");
  }
}

async function closeRoom(withConfirmation = true) {
  if (!currentRoom || busy) return;
  if (withConfirmation && !window.confirm(t("home.confirmClose"))) return;
  setBusy(true);
  try {
    const response = await fetch(runtime.apiUrl("/api/room-control/close"), {
      method: "POST",
      headers: {Authorization: "Bearer " + currentRoom.host_control, Accept: "application/json"}
    });
    if (!response.ok) throw new Error("close failed");
    await clearCurrentRoom("closed", "home.roomClosedLink");
    setNotice("");
  } catch (_) {
    setState("error", "home.closeFailed");
  } finally {
    setBusy(false);
  }
}

$("createVoiceBtn").onclick = () => createRoom("voice");
$("createChatBtn").onclick = () => createRoom("chat");
$("createBtn").onclick = () => createRoom("video");
$("signOutBtn").onclick = async () => {
  try {
    await fetch(runtime.apiUrl("/auth/logout"), {method: "POST", headers: {Accept: "application/json"}});
  } catch (_) { /* the reload re-reads the session either way */ }
  location.reload();
};
$("deleteAccountBtn").onclick = deleteAccount;
$("copyBtn").onclick = copyLink;
$("shareBtn").onclick = shareLink;
$("openBtn").onclick = openRoom;
$("closeBtn").onclick = () => closeRoom(true);
$("waBtn").onclick = () => {
  if (currentRoom && !busy) openShareApp("https://wa.me/?text=" + encodeURIComponent(shareMessage()));
};
// The /R/share form carries the sentence and the link together; the
// social-plugins form takes a url only and drops everything that explains it.
$("lineBtn").onclick = () => {
  if (currentRoom && !busy) openShareApp("https://line.me/R/share?text=" + encodeURIComponent(shareMessage()));
};
// Drawn on the tap that asks for it, never on load: the link inside is the
// bearer token that opens the room.
$("qrBtn").onclick = () => {
  if (!currentRoom || busy) return;
  if (!$("qrBox").hidden) {
    hideQr();
    return;
  }
  $("qrBox").replaceChildren(window.LinguaQR.svg(roomUrl(currentRoom)));
  $("qrBox").hidden = false;
  $("qrBtn").setAttribute("aria-expanded", "true");
};
// In a native shell window.open navigates the dashboard away, and the system
// share sheet already lists both apps. The QR stays: it is the WeChat path.
if (runtime.isNative) {
  $("waBtn").hidden = true;
  $("lineBtn").hidden = true;
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshStatus();
});
if (!runtime.isNative && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
// The dashboard is the first screen a host sees, before any room and before
// the room's own language gate — so the choice has to be offered here too.
// Native language names come from the platform rather than a catalog fetch.
function fillAppLocaleSelect() {
  const select = $("appLocaleSel");
  const named = runtime.i18n.languages.map(code => {
    let label = code;
    try {
      label = new Intl.DisplayNames([code], {type: "language"}).of(code) || code;
    } catch (_) { /* an unknown tag keeps its code */ }
    return {code, label: label.charAt(0).toLocaleUpperCase(code) + label.slice(1)};
  }).sort((left, right) => left.label.localeCompare(right.label));
  select.replaceChildren();
  for (const {code, label} of named) {
    const option = document.createElement("option");
    option.value = code;
    option.textContent = label;
    option.selected = code === runtime.i18n.language;
    select.appendChild(option);
  }
}
fillAppLocaleSelect();
$("appLocaleSel").onchange = () => runtime.i18n.use($("appLocaleSel").value);

// A language switch re-renders whatever is already on screen: the live status
// line and the notice both carry a key, not finished text.
runtime.i18n.onChange(() => {
  $("appLocaleSel").value = runtime.i18n.language;
  $("roomState").textContent = t(stateKey, stateParams);
  $("roomNotice").textContent = noticeKey ? t(noticeKey, noticeParams) : "";
  setAuthStatus(authStatusKey);
  renderAccount();
});

async function boot() {
  try {
    await runtime.ready();
  } catch (_) {
    setState("error", "home.needsUpdate");
    setBusy(true);
    return;
  }
  if (new URLSearchParams(location.search).get("auth") === "failed") setAuthStatus("auth.failed");
  account = await loadAccount();
  renderAccount();
  currentRoom = await loadRoom();
  if (currentRoom && currentRoom.expires_at * 1000 > Date.now()) {
    renderRoom("ready", 0);
    startPolling();
    refreshStatus();
  } else if (currentRoom) {
    await forgetRoom();
    currentRoom = null;
    setState("expired", "home.roomExpired");
  }
}
boot();
</script>
</body>
</html>
