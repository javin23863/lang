<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Translator Room</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b141a;
color:#e9edef;padding:24px}.card{width:min(420px,100%);background:#111b21;border-radius:18px;
padding:28px;box-shadow:0 12px 36px #0008}h1{font-size:26px;margin:0 0 10px}p{color:#aebac1;
line-height:1.5;margin:0 0 22px}button{width:100%;border:0;border-radius:24px;padding:14px;
font:700 16px inherit;background:#00a884;color:#fff;cursor:pointer}
</style>
</head>
<body><main class="card">
  <h1>Private translated call</h1>
  <p>Create a private link, then share it with your WhatsApp contact. The link expires after 24 hours.</p>
  <form method="post" action="/rooms"><button type="submit">Create private room</button></form>
</main></body>
</html>
