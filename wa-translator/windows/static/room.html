<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111b21">
<link rel="manifest" href="/manifest.webmanifest">
<title>Live Translator Room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
     background:#0b141a;color:#e9edef;display:flex;flex-direction:column;
     overflow:hidden}

/* ── video ───────────────────────────────────────────────── */
#stage{position:relative;background:#000;flex:0 0 auto;height:34vh;min-height:180px}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
#selfWrap{position:absolute;right:10px;bottom:10px;width:27%;max-width:130px;
          aspect-ratio:3/4;border-radius:10px;overflow:hidden;
          border:2px solid rgba(255,255,255,.25);background:#111b21;
          box-shadow:0 3px 12px rgba(0,0,0,.5)}
#selfVideo{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#videoNote{position:absolute;inset:0;display:flex;align-items:center;
           justify-content:center;text-align:center;padding:16px;font-size:13px;
           color:#8696a0;background:#0b141a}
#videoNote.hidden{display:none}

/* ── captions ────────────────────────────────────────────── */
#captions{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;
          flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:10px;max-width:88%;word-wrap:break-word;
     animation:fade .12s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.msg.mine{background:#005c4b;align-self:flex-end;border-radius:10px 2px 10px 10px}
.msg.theirs{background:#202c33;align-self:flex-start;border-radius:2px 10px 10px 10px}
.msg .who{font-size:10px;color:#8696a0;margin-bottom:3px;letter-spacing:.04em}
.msg .lead{font-size:17px;line-height:1.35}
.msg .sub{font-size:13px;line-height:1.35;color:#8696a0;margin-top:3px}
.msg.live{opacity:.75}
.msg.live .lead::after{content:'▌';animation:blink 1s steps(2) infinite;color:#53bdeb}
@keyframes blink{50%{opacity:0}}

/* ── controls ────────────────────────────────────────────── */
#bar{flex:0 0 auto;background:#111b21;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
     display:grid;grid-template-columns:minmax(100px,1fr) repeat(4,42px);gap:7px;
     align-items:center;border-top:1px solid #202c33}
button{border:none;border-radius:20px;font-size:14px;font-weight:600;
       cursor:pointer;padding:11px 12px;font-family:inherit;min-height:42px}
#micBtn{background:#075E54;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
#micBtn.on{background:#d32f2f}
#micBtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
             background:#fff;margin-right:7px;animation:blink 1s infinite}
.icon{background:#202c33;color:#e9edef;padding:9px;width:42px}
.icon.off{background:#202c33;color:#8696a0;text-decoration:line-through}
#settings{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.setting{display:flex;flex-direction:column;gap:3px;min-width:0;color:#8696a0;
         font-size:10px;text-align:left}
.setting select{width:100%;min-width:0;background:#202c33;color:#e9edef;border:0;
         border-radius:8px;padding:8px 5px;font-size:12px;font-family:inherit}
#status{position:absolute;top:0;left:0;right:0;padding:5px;text-align:center;
        font-size:11px;color:#e9edef;background:rgba(0,0,0,.55);z-index:5}
#participantCount{position:absolute;top:29px;left:8px;padding:4px 7px;border-radius:10px;
        font-size:11px;color:#e9edef;background:rgba(0,0,0,.55);z-index:5}
#roleGate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
          justify-content:center;padding:18px;background:rgba(11,20,26,.96)}
#roleGate[hidden]{display:none}
.roleCard{width:min(100%,420px);background:#111b21;border:1px solid #2a3942;
          border-radius:16px;padding:20px;box-shadow:0 12px 36px rgba(0,0,0,.5)}
.roleCard h1{font-size:22px;line-height:1.2;margin-bottom:8px}
.roleCard>p{color:#aebac1;font-size:14px;line-height:1.45}
.roleChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}
.roleChoice{background:#075e54;color:#fff;border-radius:12px;text-align:left;padding:14px}
.roleChoice strong,.roleChoice span{display:block}
.roleChoice strong{font-size:17px;margin-bottom:4px}
.roleChoice span{font-size:12px;font-weight:400;line-height:1.35}
.routeNote{padding-top:12px;border-top:1px solid #2a3942}
#roleSummary{grid-column:1/-1;color:#aebac1;font-size:11px;line-height:1.35;
             padding:1px 2px 0}
@media(max-width:380px){
  #stage{height:31vh;min-height:160px}
  #captions{padding:8px 10px 6px}
  #bar{padding-left:7px;padding-right:7px;gap:5px;grid-template-columns:minmax(90px,1fr) repeat(4,38px)}
  .icon{width:38px;padding:7px}.setting select{font-size:11px;padding:7px 3px}
  .roleCard{padding:16px}.roleChoices{grid-template-columns:1fr;margin:14px 0 12px}
}
</style>
</head>
<body>

<div id="roleGate" role="dialog" aria-modal="true" aria-labelledby="roleTitle">
  <div class="roleCard">
    <h1 id="roleTitle">What language will you speak?</h1>
    <p>Choose for this device before joining. Do not choose the other person's language.</p>
    <div class="roleChoices">
      <button class="roleChoice" data-lang="en">
        <strong>English</strong><span>I will speak English on this device</span>
      </button>
      <button class="roleChoice" data-lang="es">
        <strong>Español</strong><span>Hablaré español en este dispositivo</span>
      </button>
    </div>
    <p class="routeNote">Your own translated words play on the other device. Translated voice on this device is only for incoming speech.</p>
  </div>
</div>

<div id="stage">
  <video id="remoteVideo" autoplay playsinline></video>
  <div id="videoNote">Waiting for the other person to join…</div>
  <div id="selfWrap"><video id="selfVideo" autoplay playsinline muted></video></div>
  <div id="status">Choose your language</div>
  <div id="participantCount" aria-live="polite">0 / 4 people</div>
</div>

<div id="captions"></div>

<div id="bar">
  <button id="micBtn">🎤 Start</button>
  <button id="shareBtn" class="icon" title="Share this private room" aria-label="Share">📤</button>
  <button id="camBtn" class="icon" title="Turn camera on or off" aria-label="Camera">📷</button>
  <button id="voiceBtn" class="icon off" title="Turn translated voice on or off" aria-label="Translated voice">🔇</button>
  <button id="leaveBtn" class="icon" title="Leave this room" aria-label="Leave room">🚪</button>
  <div id="settings">
    <label class="setting">I speak<select id="langSel"></select></label>
    <label class="setting">Voice I hear<select id="listenVoiceSel">
      <option value="match">Match speaker</option>
      <option value="female">Female</option>
      <option value="male">Male</option>
    </select></label>
    <label class="setting">My voice<select id="publishVoiceSel">
      <option value="female">Female</option>
      <option value="male">Male</option>
    </select></label>
    <div id="roleSummary" aria-live="polite"></div>
  </div>
</div>

<script>
const LANG_NAMES = {en: 'English', es: 'Español'};
const $ = (id) => document.getElementById(id);
const roomId = location.pathname.split('/').filter(Boolean).pop();

let ws, myId = null, ttsToken = null, myLang = null;
let myVoiceStyle = 'female', listenVoiceStyle = 'match';

let mediaStream = null, audioCtx = null, workletNode = null;
let micOn = false, camOn = true, roomFull = false, reconnectFailures = 0;
let terminalRoom = false, leaving = false, turnRefreshTimer = null, iceRefreshPromise = null;
let explicitLeave = false;
let presenceHeartbeatTimer = null;
let iceServers = [{urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302']}];
let iceExpiresAt = 0;
const peers = new Map();   // id -> {pc, lang, polite, makingOffer, ignoreOffer}
const bubbles = new Map(); // "speakerId:seq" -> element

function setStatus(text, sticky) {
  const el = $('status');
  el.textContent = text;
  el.style.display = text ? 'block' : 'none';
  if (!sticky && text) setTimeout(() => { if (el.textContent === text) el.style.display = 'none'; }, 3000);
}

// ── WebSocket and short-lived ICE configuration ──────────
function scheduleTurnRefresh(delay) {
  clearTimeout(turnRefreshTimer);
  if (terminalRoom) return;
  turnRefreshTimer = setTimeout(() => refreshIceServers(true),
                                Math.max(1000, Math.min(delay, 2147483647)));
}

function updateRoleSummary() {
  if (myLang === 'en') {
    $('roleSummary').textContent = 'Incoming Spanish becomes English on this device. Your English is translated for a Spanish listener.';
  } else if (myLang === 'es') {
    $('roleSummary').textContent = 'Incoming English becomes Spanish on this device. Your Spanish is translated for an English listener.';
  }
}

let roleChosen = false;
function chooseLanguage(lang) {
  if (roleChosen || !(lang in LANG_NAMES)) return;
  roleChosen = true;
  myLang = lang;
  $('roleGate').hidden = true;
  updateRoleSummary();
  setStatus('Joining as an ' + LANG_NAMES[lang] + ' speaker…', true);
  connect();
}

document.querySelectorAll('.roleChoice').forEach(button => {
  button.onclick = () => chooseLanguage(button.dataset.lang);
});

function updateParticipantCount(serverCount) {
  const derived = myId === null ? 0 : peers.size + 1;
  const count = Number.isInteger(serverCount) && serverCount >= 0 && serverCount <= 4
    ? serverCount : derived;
  $('participantCount').textContent = count + ' / 4 ' + (count === 1 ? 'person' : 'people');
}

function stopPresenceHeartbeat() {
  clearInterval(presenceHeartbeatTimer);
  presenceHeartbeatTimer = null;
}

function startPresenceHeartbeat(interval) {
  stopPresenceHeartbeat();
  if (interval === undefined) return; // The local adapter needs no app lease.
  if (!Number.isInteger(interval) || interval < 1000 || interval > 15000) {
    throw new Error('invalid presence heartbeat interval');
  }
  presenceHeartbeatTimer = setInterval(() => send({type: 'heartbeat'}), interval);
}

function applyIceServersToPeers() {
  for (const {pc} of peers.values()) {
    if (pc.connectionState === 'closed') continue;
    try {
      pc.setConfiguration({iceServers});
      pc.restartIce();
    } catch (_) {
      // A connection closing at the same moment will be rebuilt by signalling.
    }
  }
}

async function refreshIceServers(force = false) {
  if (!force && Date.now() < iceExpiresAt - 60000) {
    scheduleTurnRefresh(iceExpiresAt - Date.now() - 60000);
    return;
  }
  if (iceRefreshPromise) return iceRefreshPromise;
  iceRefreshPromise = (async () => {
    try {
      const response = await fetch('/api/turn', {
        headers: {'Authorization': 'Bearer ' + roomId, 'Accept': 'application/json'}
      });
      if (response.status === 404) return; // Local adapter intentionally uses STUN.
      if (!response.ok) {
        scheduleTurnRefresh(30000);
        return;
      }
      const value = await response.json();
      if (!Array.isArray(value.iceServers) || !value.iceServers.length) {
        throw new Error('empty ICE config');
      }
      iceServers = value.iceServers;
      iceExpiresAt = Number(value.expires_at) * 1000 || Date.now() + 300000;
      applyIceServersToPeers();
      scheduleTurnRefresh(iceExpiresAt - Date.now() - 60000);
    } catch (_) {
      scheduleTurnRefresh(30000);
      // Direct connections still work on compatible networks. A relay failure
      // remains visible in connection state; no long-term key is in this page.
    }
  })().finally(() => { iceRefreshPromise = null; });
  return iceRefreshPromise;
}

async function preflightRoom() {
  if (terminalRoom) return false;
  try {
    const response = await fetch('/api/room', {
      headers: {'Authorization': 'Bearer ' + roomId, 'Accept': 'application/json'}
    });
    if (response.status === 401 || response.status === 410) {
      terminalRoom = true;
      clearTimeout(turnRefreshTimer);
      failVoice('Natural audio restored because this private room expired');
      setStatus('This private room has expired or is unavailable', true);
      showVideoNote('Ask the caller to create a new private room.');
      return false;
    }
    // 404 keeps compatibility with an older local adapter that has no
    // preflight route. Other transient failures still get the bounded retry.
    return true;
  } catch (_) {
    return true;
  }
}

async function connect() {
  if (leaving) return;
  if (!await preflightRoom()) return;
  await refreshIceServers();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' +
                     location.host + '/ws/' + encodeURIComponent(roomId));
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    reconnectFailures = 0;
    setStatus('Connected');
    send({type: 'join', lang: myLang, name: LANG_NAMES[myLang],
          voice_style: myVoiceStyle});
  };
  ws.onclose = (event) => {
    stopPresenceHeartbeat();
    if (leaving) return;
    failVoice('Natural audio restored while reconnecting');
    ttsToken = null;
    if (terminalRoom) return;
    if (event.code === 1008) {
      setStatus('This private room has expired or is unavailable', true);
      showVideoNote('Ask the caller to create a new private room.');
      return;
    }
    if (roomFull) return;   // retrying a full room just hammers the server
    setStatus('Reconnecting…', true);
    reconnectFailures++;
    const delay = Math.min(8000, 250 * 2 ** Math.min(reconnectFailures, 5));
    setTimeout(connect, delay);
  };
  ws.onmessage = async (ev) => {
    try { await handle(JSON.parse(ev.data)); }
    catch (_) { ws.close(1008, 'invalid server message'); }
  };
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function disconnectRoom(notifyServer) {
  if (leaving) return;
  leaving = true;
  stopPresenceHeartbeat();
  clearTimeout(turnRefreshTimer);
  setMicEnabled(false);
  if (notifyServer) send({type: 'leave'});
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.close(1000, notifyServer ? 'left room' : 'page suspended');
  }
  failVoice();
  peers.forEach(p => p.pc.close());
  peers.clear();
  if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
  mediaStream = null;
  mediaPromise = null;
  workletNode = null;
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null;
  ws = null;
  ttsToken = null;
  updateParticipantCount(0);
}

function leaveRoom() {
  explicitLeave = true;
  disconnectRoom(true);
  setStatus('You left this room', true);
  showVideoNote('You left this private room.');
}

function suspendRoom() {
  if (explicitLeave) return;
  // A BFCache navigation is not a user Leave. Closing the socket still frees
  // the server slot immediately, while pageshow.persisted can create a fresh
  // connection when the cached page is restored.
  disconnectRoom(false);
}

function restoreSuspendedRoom(event) {
  if (!event.persisted || explicitLeave) return;
  leaving = false;
  roomFull = false;
  reconnectFailures = 0;
  myId = null;
  updateParticipantCount(0);
  if (!roleChosen || terminalRoom) return;
  setStatus('Rejoining this room…', true);
  showVideoNote('Reconnecting to the other person…');
  connect();
}

$('leaveBtn').onclick = leaveRoom;

async function handle(m) {
  if (m.type === 'welcome') {
    // A dropped WebSocket reconnects and rejoins, and the server issues a new
    // id. Every existing peer connection was negotiated against the old one —
    // including who is polite — and the peers themselves are now known by new
    // ids too, so the old ones can never be signalled again. Start clean.
    if (myId !== null && myId !== m.id) {
      peers.forEach(p => p.pc.close());
      peers.clear();
      showVideoNote('Reconnecting to the other person…');
    }
    myId = m.id;
    ttsToken = m.tts_token;
    renderLangs(m.langs);
    startPresenceHeartbeat(m.heartbeat_interval_ms);
    // myId decides who is polite, so no peer may be built before it is known.
    for (const peer of m.peers) startPeer(peer);
    updateParticipantCount(m.participant_count);
  } else if (m.type === 'peer_join') {
    setStatus(LANG_NAMES[m.lang] + ' speaker joined');
    startPeer(m);
    updateParticipantCount(m.participant_count);
  } else if (m.type === 'peer_update') {
    const p = peers.get(m.id);
    if (p) { p.lang = m.lang; p.voiceStyle = m.voice_style; }
  } else if (m.type === 'peer_leave') {
    const p = peers.get(m.id);
    if (p) { p.pc.close(); peers.delete(m.id); }
    updateParticipantCount(m.participant_count);
    failVoice('Natural audio restored because a participant left');
    if (peers.size === 0) {
      showVideoNote('The other person left.');
    }
  } else if (m.type === 'presence') {
    updateParticipantCount(m.participant_count);
  } else if (m.type === 'signal') {
    await onSignal(m.from, m.data);
  } else if (m.type === 'caption') {
    renderCaption(m);
  } else if (m.type === 'room_full') {
    // Say which wall was hit. Otherwise the socket just closes and the page
    // retries forever, looking like the server is down.
    roomFull = true;
    updateParticipantCount(m.participant_count);
    setStatus('Room is full (' + m.limit + ' people) — closed devices clear within 90 seconds', true);
    showVideoNote('Room is full. If someone just closed it, try again within 90 seconds.');
  }
}

// ── Captions ──────────────────────────────────────────────
function renderCaption(m) {
  const key = m.speaker + ':' + m.seq;
  let el = bubbles.get(key);

  if (m.final && !m.original) {           // nothing intelligible — drop the bubble
    if (el) el.remove();
    bubbles.delete(key);
    return;
  }
  if (!m.original) return;

  const mine = m.speaker === myId;
  if (!el) {
    el = document.createElement('div');
    el.className = 'msg ' + (mine ? 'mine' : 'theirs');
    el.innerHTML = '<div class="who"></div><div class="lead"></div><div class="sub"></div>';
    $('captions').appendChild(el);
    bubbles.set(key, el);
  }

  // You read the translation; the speaker reads their own words. Whichever is
  // in your language is the big line.
  const translated = m.translations[myLang] || '';
  const lead = (!mine && translated) ? translated : m.original;
  const sub = (!mine && translated) ? m.original : (mine ? translated : '');

  el.classList.toggle('live', !m.final);
  el.querySelector('.who').textContent =
    (mine ? 'You' : LANG_NAMES[m.speaker_lang] || m.speaker_lang) +
    (m.final ? '' : ' · live');
  el.querySelector('.lead').textContent = lead;
  el.querySelector('.sub').textContent = sub;
  $('captions').scrollTop = $('captions').scrollHeight;

  // Finals only. Partials are rewritten as the sentence lands, so speaking them
  // would stutter and repeat, and the server suppresses duplicate finals — so
  // this is the one event per utterance worth saying out loud.
  if (m.final && !mine && translated) speak(translated, myLang, m.speaker);
}

// ── Spoken translation ────────────────────────────────────
// Captions-only is the safe default. Cloud speech always comes from one of the
// four controlled Kokoro routes; no browser voice or biometric inference is used.
let voiceOn = false, speaking = false, asrPaused = false;
let speechGeneration = 0, ttsRequestId = 0, activeSpeech = null;
const fallbackAudio = new Audio();
let fallbackUrl = null;
const speakQueue = [];

function setNaturalAudioMuted(muted) {
  $('remoteVideo').muted = muted;
}

function updateVoiceButton() {
  $('voiceBtn').className = 'icon' + (voiceOn ? '' : ' off');
  $('voiceBtn').textContent = voiceOn ? '🔊' : '🔇';
  $('voiceBtn').setAttribute('aria-pressed', String(voiceOn));
}

function resolvedVoiceStyle(speakerId) {
  if (listenVoiceStyle !== 'match') return listenVoiceStyle;
  return peers.get(speakerId)?.voiceStyle || 'female';
}

function speak(text, lang, speakerId) {
  if (!voiceOn || !text) return;
  speakQueue.push({text, lang, voiceStyle: resolvedVoiceStyle(speakerId)});
  drainSpeech();
}

function drainSpeech() {
  if (speaking || !speakQueue.length) return;
  const {text, lang, voiceStyle} = speakQueue.shift();
  const item = {
    id: ++ttsRequestId, text, lang, voiceStyle, generation: speechGeneration,
    settled: false, controller: null, fallbackStarted: false,
    playTimer: null, fetchTimer: null
  };
  speaking = true;
  activeSpeech = item;
  requestFallbackSpeech(item);
}

async function requestFallbackSpeech(item) {
  if (item.settled || item !== activeSpeech || item.generation !== speechGeneration || !voiceOn) return;
  if (item.fallbackStarted) return;
  item.fallbackStarted = true;
  item.controller = new AbortController();
  item.fetchTimer = setTimeout(() => item.controller.abort(), 65000);
  try {
    const body = JSON.stringify({text: item.text, lang: item.lang,
                                 voice_style: item.voiceStyle});
    const headers = {'Content-Type': 'application/json',
                     'Authorization': 'Bearer ' + roomId,
                     'X-Participant-ID': myId};
    if (ttsToken) headers['X-TTS-Token'] = ttsToken;
    const retryDeadline = Date.now() + 30000;
    let response, retryDelay = 250;
    while (true) {
      response = await fetch('/tts', {
        method: 'POST',
        headers,
        body,
        signal: item.controller.signal
      });
      if (response.status !== 429 || Date.now() + retryDelay > retryDeadline) break;
      await response.text();
      await new Promise(resolve => setTimeout(resolve, retryDelay));
      if (item.controller.signal.aborted) throw new DOMException('Aborted', 'AbortError');
      retryDelay = Math.min(2000, retryDelay * 2);
    }
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const audio = await response.blob();
    if (!audio.size) throw new Error('empty audio');
    if (item.settled || item !== activeSpeech || item.generation !== speechGeneration) return;

    stopFallbackAudio();
    fallbackUrl = URL.createObjectURL(audio);
    fallbackAudio.src = fallbackUrl;
    fallbackAudio.volume = 1;
    fallbackAudio.onplaying = () => {
      if (item.settled || item !== activeSpeech
          || item.generation !== speechGeneration || !voiceOn) return;
      setNaturalAudioMuted(true);
    };
    fallbackAudio.onended = () => finishSpeech(item);
    fallbackAudio.onerror = () => finishSpeech(item, 'Could not play spoken translation');
    item.playTimer = setTimeout(
      () => finishSpeech(item, 'Spoken translation playback timed out'), 60000);
    // Pause only the local caption feed before translated audio can enter the
    // room. Natural peer audio stays live until the playback event itself.
    setAsrPaused(true);
    await fallbackAudio.play();
  } catch (error) {
    if (error.name === 'AbortError' && item.settled) return;
    finishSpeech(item, error.name === 'NotAllowedError'
      ? 'Tap Start to allow spoken translation'
      : 'Spoken translation is temporarily unavailable');
  } finally {
    clearTimeout(item.fetchTimer);
  }
}

function stopFallbackAudio() {
  fallbackAudio.onplaying = fallbackAudio.onended = fallbackAudio.onerror = null;
  fallbackAudio.pause();
  fallbackAudio.removeAttribute('src');
  if (fallbackUrl) {
    URL.revokeObjectURL(fallbackUrl);
    fallbackUrl = null;
  }
}

function finishSpeech(item, error) {
  // Browser media can report a rejected play and a later error for the same
  // element. Only the first completion may advance the shared queue.
  if (!item || item.settled) return;
  item.settled = true;
  clearTimeout(item.playTimer);
  clearTimeout(item.fetchTimer);
  if (item !== activeSpeech || item.generation !== speechGeneration) return;
  stopFallbackAudio();
  setNaturalAudioMuted(false);
  activeSpeech = null;
  if (error) {
    speaking = false;
    setAsrPaused(false);
    failVoice(error);
    return;
  }
  // Let the room go quiet before listening again, or the tail of the
  // utterance is still in the air when the mic reopens. Keep `speaking` true
  // through this tail so a newly queued final cannot start early. Once the
  // tail ends, reopen ASR before fetching the next fallback WAV: synthesis is
  // silent and must not unnecessarily suppress captions.
  setTimeout(() => {
    if (item.generation !== speechGeneration) return;
    speaking = false;
    setAsrPaused(false);
    drainSpeech();
  }, 250);
}

function cancelSpeech() {
  const needsTail = asrPaused;
  speechGeneration++;
  const generation = speechGeneration;
  speakQueue.length = 0;
  if (activeSpeech) {
    activeSpeech.settled = true;
    clearTimeout(activeSpeech.playTimer);
    clearTimeout(activeSpeech.fetchTimer);
    if (activeSpeech.controller) activeSpeech.controller.abort();
    activeSpeech = null;
  }
  stopFallbackAudio();
  setNaturalAudioMuted(false);
  if (needsTail) {
    // Block a rapid off/on or language-change final until the cancelled sound
    // has left the room. Otherwise this old timer could reopen ASR in the
    // middle of the new utterance.
    speaking = true;
    setTimeout(() => {
      if (generation !== speechGeneration) return;
      speaking = false;
      setAsrPaused(false);
      drainSpeech();
    }, 250);
  } else {
    speaking = false;
    setAsrPaused(false);
  }
}

function failVoice(message) {
  const wasOn = voiceOn;
  voiceOn = false;
  cancelSpeech();
  setNaturalAudioMuted(false);
  updateVoiceButton();
  if (message && wasOn) setStatus(message);
}

let audioUnlocked = false;
const SILENT_WAV = 'data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';

function unlockFallbackAudio() {
  if (audioUnlocked) return;
  // Reuse this exact element for later translations. On iOS, unlocking a
  // disposable element does not reliably authorize a different one.
  fallbackAudio.src = SILENT_WAV;
  fallbackAudio.volume = 0;
  fallbackAudio.play().then(() => {
    audioUnlocked = true;
    fallbackAudio.pause();
    fallbackAudio.removeAttribute('src');
    fallbackAudio.volume = 1;
  }).catch(() => {});
}

function setAsrPaused(p) {
  // Flush on the transition that stops capture. Playback has not started yet,
  // and reopening after its tail deliberately sends no second flush.
  if (p && !asrPaused) sendSpeechEnd();
  asrPaused = p;
  if (workletNode) workletNode.port.postMessage({on: micOn && !asrPaused});
}

function sendSpeechEnd() {
  if (micOn && !asrPaused) send({type: 'speech_end'});
}

$('voiceBtn').onclick = () => {
  unlockFallbackAudio();
  if (voiceOn) {
    failVoice();
  } else {
    voiceOn = true;
    updateVoiceButton();
  }
  setStatus(voiceOn ? 'Speaking translations aloud' : 'Translations muted — captions only');
};

$('listenVoiceSel').onchange = () => {
  listenVoiceStyle = $('listenVoiceSel').value;
  cancelSpeech();
};

$('publishVoiceSel').onchange = () => {
  myVoiceStyle = $('publishVoiceSel').value;
  send({type: 'set_voice_style', voice_style: myVoiceStyle});
};

updateVoiceButton();

$('shareBtn').onclick = async () => {
  const invite = {
    title: 'Private translated video call',
    text: 'Join my private English–Spanish video call.',
    url: location.href
  };
  if (navigator.share) {
    try {
      await navigator.share(invite);
      setStatus('Invitation shared');
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  const message = invite.text + '\n' + invite.url;
  const opened = window.open('https://wa.me/?text=' + encodeURIComponent(message),
                             '_blank');
  if (opened) opened.opener = null;
  if (!opened) {
    try {
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(invite.url);
        setStatus('Private room link copied');
        return;
      }
    } catch (_) {}
    setStatus('Could not open WhatsApp — copy the address-bar link', true);
  }
};

// ── Media ─────────────────────────────────────────────────
// Cache the promise, not the resolved stream. startPeer, the mic button and the
// camera button can all ask for media at once; guarding on `mediaStream` lets
// each of them open its own capture, and then the tracks published to the peer
// belong to a different stream than the one mute toggles.
let mediaPromise = null;

function getMedia() {
  if (!mediaPromise) {
    mediaPromise = navigator.mediaDevices.getUserMedia({
      video: {facingMode: 'user', width: {ideal: 640}, height: {ideal: 480}},
      audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}
    }).then(stream => {
      mediaStream = stream;
      $('selfVideo').srcObject = stream;
      stream.getAudioTracks().forEach(track => {
        track.onended = () => { if (micOn) setMicEnabled(false); };
      });
      // The camera may be wanted before the mic is. The audio track exists from
      // here on and gets published to the peer as soon as one connects, so it
      // starts disabled and only setMicEnabled turns it on.
      setMicEnabled(micOn);
      return stream;
    }).catch(err => {
      mediaPromise = null;   // let the user retry after granting permission
      throw err;
    });
  }
  return mediaPromise;
}

// Single owner of mic state. Every consumer of the microphone is toggled here:
// the track published to the peer AND the worklet feeding captions. They were
// separate before, so the button muted the captions while the other person
// could still hear the room.
function setMicEnabled(on) {
  if (!on && micOn && !asrPaused) sendSpeechEnd();
  micOn = on;
  if (mediaStream) mediaStream.getAudioTracks().forEach(t => { t.enabled = on; });
  // `asrPaused` outranks the button while a translation is being spoken —
  // unmuting mid-utterance would feed our own speaker straight back into ASR.
  // The peer still hears the live track; only the caption feed is held.
  if (workletNode) workletNode.port.postMessage({on: on && !asrPaused});
  $('micBtn').className = on ? 'on' : '';
  $('micBtn').innerHTML = on
    ? '<span class="dot"></span>Listening — tap to mute'
    : '🎤 Start';
}

async function startCapture() {
  const stream = await getMedia();
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.audioWorklet.addModule('/static/pcm-worklet.js');
    workletNode = new AudioWorkletNode(audioCtx, 'pcm-worklet');
    workletNode.port.onmessage = (e) => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
    };
    audioCtx.createMediaStreamSource(stream).connect(workletNode);
    // Not connected to destination: this branch exists to be captured, not
    // heard. The other person's voice arrives over WebRTC instead.
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
}

$('micBtn').onclick = async () => {
  unlockFallbackAudio();
  try {
    if (micOn) {
      setMicEnabled(false);
      setStatus('Muted — the other person cannot hear you');
      return;
    }
    $('micBtn').textContent = 'Starting…';
    await startCapture();
    for (const p of peers.values()) addTracks(p.pc);
    setMicEnabled(true);
    setStatus('Mic on — speak ' + LANG_NAMES[myLang]);
  } catch (err) {
    setMicEnabled(false);
    setStatus('Mic blocked: ' + err.name, true);
  }
};

$('camBtn').onclick = async () => {
  await getMedia();
  camOn = !camOn;
  mediaStream.getVideoTracks().forEach(t => t.enabled = camOn);
  $('camBtn').className = 'icon' + (camOn ? '' : ' off');
};

function renderLangs(langs) {
  const sel = $('langSel');
  sel.innerHTML = '';
  langs.forEach(l => {
    const o = document.createElement('option');
    o.value = l; o.textContent = LANG_NAMES[l] || l;
    if (l === myLang) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => {
    cancelSpeech();
    sendSpeechEnd();
    myLang = sel.value;
    updateRoleSummary();
    send({type: 'set_lang', lang: myLang});
  };
}

// ── WebRTC (perfect negotiation; lower id is polite) ──────
function showVideoNote(text) {
  $('videoNote').textContent = text;
  $('videoNote').classList.remove('hidden');
}

function addTracks(pc) {
  if (!mediaStream) return;
  const existing = pc.getSenders().map(s => s.track);
  mediaStream.getTracks().forEach(t => { if (!existing.includes(t)) pc.addTrack(t, mediaStream); });
}

// Synchronous and idempotent on purpose. This used to await getMedia() before
// registering in `peers`, so a signal arriving during that await found no entry
// and built a second RTCPeerConnection for the same peer: the SDP was applied to
// one and the ICE candidates were emitted by the other, and one side of the call
// never sent a single candidate. Nothing may await before peers.set().
function startPeer(peer) {
  const peerId = typeof peer === 'object' ? peer.id : peer;
  const existing = peers.get(peerId);
  if (existing) {
    if (typeof peer === 'object') {
      existing.lang = peer.lang;
      existing.voiceStyle = peer.voice_style;
    }
    return existing;
  }

  const pc = new RTCPeerConnection({iceServers});
  const state = {pc, polite: myId > peerId, makingOffer: false, ignoreOffer: false,
                 lang: peer?.lang || 'en', voiceStyle: peer?.voice_style || 'female'};
  peers.set(peerId, state);

  // Media may not be granted yet. Adding tracks later fires negotiationneeded
  // on its own, which is what drives the offer — on both sides, with the
  // polite/impolite rule below resolving the collision.
  getMedia().then(() => addTracks(pc)).catch(() => {});

  pc.ontrack = (e) => {
    $('remoteVideo').srcObject = e.streams[0];
    setNaturalAudioMuted(asrPaused);
    $('videoNote').classList.add('hidden');
  };
  pc.onicecandidate = (e) => {
    if (e.candidate) send({type: 'signal', to: peerId, data: {candidate: e.candidate}});
  };
  pc.onnegotiationneeded = async () => {
    try {
      state.makingOffer = true;
      await pc.setLocalDescription();
      send({type: 'signal', to: peerId, data: {description: pc.localDescription}});
    } finally { state.makingOffer = false; }
  };
  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === 'failed') {
      failVoice('Natural audio restored after the media connection failed');
      showVideoNote('Video could not connect through your networks. Captions are still live.');
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
      failVoice('Natural audio restored after the media connection ended');
    }
  };
  setTimeout(() => {
    if (pc.iceConnectionState !== 'connected' && pc.iceConnectionState !== 'completed') {
      showVideoNote('Still trying to connect video… captions are already live.');
    }
  }, 10000);

  return state;
}

async function onSignal(from, data) {
  const state = startPeer(from);   // idempotent; returns the existing peer
  const pc = state.pc;

  if (data.description) {
    const offerCollision = data.description.type === 'offer' &&
      (state.makingOffer || pc.signalingState !== 'stable');
    state.ignoreOffer = !state.polite && offerCollision;
    if (state.ignoreOffer) return;
    await pc.setRemoteDescription(data.description);
    if (data.description.type === 'offer') {
      await pc.setLocalDescription();
      send({type: 'signal', to: from, data: {description: pc.localDescription}});
    }
  } else if (data.candidate) {
    try { await pc.addIceCandidate(data.candidate); }
    catch (e) { if (!state.ignoreOffer) throw e; }
  }
}

window.addEventListener('pagehide', suspendRoom);
window.addEventListener('pageshow', restoreSuspendedRoom);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js', {scope: '/'}).catch(() => {});
}
</script>
