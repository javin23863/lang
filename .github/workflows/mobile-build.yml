name: Mobile build

on:
  pull_request:
    paths:
      - "wa-translator/mobile/**"
      - "wa-translator/windows/static/**"
      - "wa-translator/cloudflare/**"
      - "wa-translator/tools/browser/**"
      - ".github/workflows/mobile-build.yml"
      - ".github/workflows/mobile-beta.yml"
      - ".github/workflows/mobile-native-smoke.yml"
  push:
    branches:
      - main
      - "prelaunch/**"
    paths:
      - "wa-translator/mobile/**"
      - "wa-translator/windows/static/**"
      - "wa-translator/cloudflare/**"
      - "wa-translator/tools/browser/**"
      - ".github/workflows/mobile-build.yml"
      - ".github/workflows/mobile-beta.yml"
      - ".github/workflows/mobile-native-smoke.yml"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA approved for release verification
        required: true
        type: string

permissions:
  contents: read

jobs:
  product-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify frozen release commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Workflow dispatch ref resolves to ${DISPATCH_RELEASE_SHA}, expected frozen release ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Checked out ${actual}, expected frozen release ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wa-translator/cloudflare/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: npm ci && npm run check
        working-directory: wa-translator/cloudflare
      - run: python -m pip install numpy==2.4.6 websockets==17.0.1
      - run: >-
          python -m unittest
          test_language_catalog.py test_cloud_client.py
          test_latency_acceptance.py test_live_bilingual_check.py
          test_multilingual_fixtures.py
        working-directory: wa-translator/windows

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa-translator/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify frozen release commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Workflow dispatch ref resolves to ${DISPATCH_RELEASE_SHA}, expected frozen release ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Checked out ${actual}, expected frozen release ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wa-translator/mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify Play target API
        shell: bash
        run: |
          grep -Eq 'compileSdkVersion\s*=\s*36' android/variables.gradle
          grep -Eq 'targetSdkVersion\s*=\s*36' android/variables.gradle
      - run: npm ci
      - run: npm run check
      - run: npm run sync
      - run: chmod +x android/gradlew && cd android && ./gradlew :app:bundleRelease
      - name: Verify Android release artifact
        shell: bash
        run: bash scripts/verify-android-aab.sh android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lingua-relay-android-aab
          path: wa-translator/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: wa-translator/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify frozen release commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Workflow dispatch ref resolves to ${DISPATCH_RELEASE_SHA}, expected frozen release ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Checked out ${actual}, expected frozen release ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wa-translator/mobile/package-lock.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master 2026-08-14
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: wa-translator/mobile
      - name: Verify App Store SDK floor
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          sdk_major="${sdk_version%%.*}"
          if [[ ! "$xcode_major" =~ ^[0-9]+$ || "$xcode_major" -lt 26 ]]; then
            echo "App Store build requires Xcode 26 or newer; found ${xcode_version}" >&2
            exit 1
          fi
          if [[ ! "$sdk_major" =~ ^[0-9]+$ || "$sdk_major" -lt 26 ]]; then
            echo "App Store build requires iOS SDK 26 or newer; found ${sdk_version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: bundle exec fastlane --version
      - run: npm run sync
      - run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS release artifact
        shell: bash
        run: bash scripts/verify-ios-app.sh build/ios/Build/Products/Release-iphoneos/App.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lingua-relay-ios-unsigned
          path: wa-translator/mobile/build/ios/Build/Products/Release-iphoneos/App.app
          if-no-files-found: error
