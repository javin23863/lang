name: Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to deploy to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lingua-relay-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    defaults:
      run:
        working-directory: wa-translator/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact staging commit
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Dispatch ref resolves to ${DISPATCH_RELEASE_SHA}, expected ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Checked out ${actual}, expected ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wa-translator/cloudflare/package-lock.json

      - run: npm ci
      - run: npm run check

      - name: Verify Cloudflare staging credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Bind staging deployment to exact source SHA
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          sha = os.environ["EXPECTED_RELEASE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid staging release SHA")
          path = Path("wrangler.staging.jsonc")
          source = path.read_text()
          marker = '"RELEASE_SHA": "__RELEASE_SHA__"'
          if source.count(marker) != 1:
              raise SystemExit("staging release SHA seam is missing or duplicated")
          path.write_text(source.replace(marker, f'"RELEASE_SHA": "{sha}"'))
          PY
          grep -F '"RELEASE_SHA": "'"$EXPECTED_RELEASE_SHA"'"' wrangler.staging.jsonc >/dev/null

      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.staging.jsonc

      - name: Verify live staging contract and source identity
        env:
          LINGUA_EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: >-
          npm run smoke:deployment --
          https://spoken-translation-room-staging.spoken-translation-cloudflare.workers.dev
