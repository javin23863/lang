name: Mobile beta upload

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store beta to upload
        required: true
        type: choice
        options: [android, ios]

permissions:
  contents: read

concurrency:
  group: mobile-beta-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mobile-beta
    defaults:
      run:
        working-directory: wa-translator/mobile
    env:
      LINGUA_ANDROID_KEYSTORE: ${{ github.workspace }}/wa-translator/mobile/release.keystore
      GOOGLE_PLAY_JSON_KEY: ${{ github.workspace }}/wa-translator/mobile/google-play.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wa-translator/mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master 2026-08-14
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: wa-translator/mobile
      - name: Verify Play target API
        shell: bash
        run: |
          grep -Eq 'compileSdkVersion\s*=\s*36' android/variables.gradle
          grep -Eq 'targetSdkVersion\s*=\s*36' android/variables.gradle
      - name: Set unique Android version
        shell: bash
        run: |
          # Google Play caps versionCode at 2,100,000,000. Raw Unix seconds are
          # already close to that ceiling in 2026, so use minutes since 2020 and
          # reserve one decimal digit for workflow retries. This remains
          # monotonic and leaves centuries of headroom instead of roughly a decade.
          epoch_seconds="$(date -u +%s)"
          epoch_2020=1577836800
          attempt="${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$attempt" =~ ^[1-9]$ ]]; then
            echo "Android release supports workflow attempts 1-9; found ${attempt}" >&2
            exit 1
          fi
          build_minutes=$(( (epoch_seconds - epoch_2020) / 60 ))
          version_code=$(( build_minutes * 10 + attempt ))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Android versionCode ${version_code} is outside Google Play's accepted range" >&2
            exit 1
          fi
          echo "LINGUA_ANDROID_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "LINGUA_ANDROID_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - run: npm ci && npm run check && npm run sync
      - run: bundle exec fastlane --version
      - name: Materialize signing credentials
        shell: bash
        env:
          LINGUA_ANDROID_KEYSTORE_B64: ${{ secrets.LINGUA_ANDROID_KEYSTORE_B64 }}
          GOOGLE_PLAY_JSON_KEY_B64: ${{ secrets.GOOGLE_PLAY_JSON_KEY_B64 }}
        run: |
          printf '%s' "$LINGUA_ANDROID_KEYSTORE_B64" | base64 --decode > release.keystore
          printf '%s' "$GOOGLE_PLAY_JSON_KEY_B64" | base64 --decode > "$GOOGLE_PLAY_JSON_KEY"
      - name: Verify live Android launch contract
        shell: bash
        env:
          LINGUA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LINGUA_ANDROID_KEYSTORE_PASSWORD }}
          LINGUA_ANDROID_KEY_ALIAS: ${{ secrets.LINGUA_ANDROID_KEY_ALIAS }}
        run: |
          fingerprint="$(
            keytool -exportcert \
              -alias "$LINGUA_ANDROID_KEY_ALIAS" \
              -keystore "$LINGUA_ANDROID_KEYSTORE" \
              -storepass:env LINGUA_ANDROID_KEYSTORE_PASSWORD |
            openssl dgst -sha256 -binary |
            od -An -vtx1 |
            tr -d ' \n' |
            sed 's/../&:/g; s/:$//' |
            tr '[:lower:]' '[:upper:]'
          )"
          MOBILE_ANDROID_CERT_SHA256="$fingerprint" node scripts/store-preflight.mjs android
      - name: Upload Android internal beta
        env:
          LINGUA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LINGUA_ANDROID_KEYSTORE_PASSWORD }}
          LINGUA_ANDROID_KEY_ALIAS: ${{ secrets.LINGUA_ANDROID_KEY_ALIAS }}
          LINGUA_ANDROID_KEY_PASSWORD: ${{ secrets.LINGUA_ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android beta
      - name: Remove Android credentials
        if: always()
        shell: bash
        run: rm -f release.keystore "$GOOGLE_PLAY_JSON_KEY"

  ios:
    if: inputs.platform == 'ios' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: mobile-beta
    defaults:
      run:
        working-directory: wa-translator/mobile
    env:
      APPLE_DISTRIBUTION_P12: ${{ github.workspace }}/wa-translator/mobile/distribution.p12
      APPLE_PROVISIONING_PROFILE: ${{ github.workspace }}/wa-translator/mobile/lingua-relay.mobileprovision
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wa-translator/mobile/package-lock.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master 2026-08-14
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: wa-translator/mobile
      - name: Verify App Store SDK floor
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          sdk_major="${sdk_version%%.*}"
          if [[ ! "$xcode_major" =~ ^[0-9]+$ || "$xcode_major" -lt 26 ]]; then
            echo "App Store build requires Xcode 26 or newer; found ${xcode_version}" >&2
            exit 1
          fi
          if [[ ! "$sdk_major" =~ ^[0-9]+$ || "$sdk_major" -lt 26 ]]; then
            echo "App Store build requires iOS SDK 26 or newer; found ${sdk_version}" >&2
            exit 1
          fi
      - name: Set unique iOS build number
        shell: bash
        run: echo "LINGUA_IOS_BUILD_NUMBER=$(date -u +%s)" >> "$GITHUB_ENV"
      - run: npm ci && npm run check && npm run sync
      - run: bundle exec fastlane --version
      - name: Verify live iOS launch contract
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/store-preflight.mjs ios
      - name: Materialize signing credentials
        shell: bash
        env:
          APPLE_DISTRIBUTION_P12_B64: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
          APPLE_PROVISIONING_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}
        run: |
          printf '%s' "$APPLE_DISTRIBUTION_P12_B64" | base64 --decode > "$APPLE_DISTRIBUTION_P12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_B64" | base64 --decode > "$APPLE_PROVISIONING_PROFILE"
      - name: Upload TestFlight beta
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          LINGUA_KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bundle exec fastlane ios beta
      - name: Remove Apple credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain lingua-relay-ci 2>/dev/null || true
          rm -f "$APPLE_DISTRIBUTION_P12" "$APPLE_PROVISIONING_PROFILE"
