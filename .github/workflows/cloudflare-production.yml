name: Cloudflare production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA approved for production
        required: true
        type: string
      confirm:
        description: Type DEPLOY_PRODUCTION to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lingua-relay-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    defaults:
      run:
        working-directory: wa-translator/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify deliberate exact production commit
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_RELEASE_SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "DEPLOY_PRODUCTION" ]]; then
            echo "confirm must be exactly DEPLOY_PRODUCTION" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Dispatch ref resolves to ${DISPATCH_RELEASE_SHA}, expected ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Checked out ${actual}, expected ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wa-translator/cloudflare/package-lock.json

      - run: npm ci
      - run: npm run check

      - name: Verify Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.jsonc

      - name: Verify live production contract
        run: >-
          npm run smoke:deployment --
          https://spoken-translation-room.spoken-translation-cloudflare.workers.dev

      - name: Print deployment receipt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "source_sha=${{ inputs.release_sha }}"
          npx wrangler deployments list -c wrangler.jsonc
